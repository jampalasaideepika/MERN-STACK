<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        header{
            position:sticky;
            top:0;
        }
        nav{
            background-color:rgb(153, 102, 119);
            height:83px;
        }
        main{
            background-color:burlywood;
            color: black;
            padding:34px
        }
        .container{
            background-color:beige;
            margin:12px 34px;
            padding:55px 23px;
            text-align:center;
        }
        .box1{
            background-color:lightblue;
            height:70vh;
            width:45%;
            margin: 0px 12px;
            display:inline-block;
        }
        .box2{
            background-color:pink;
            height:70vh;
            width:45%;
            margin: 0px 12px;
            display:inline-block;
        }
        .text-box{
            padding:34px;
            border:2px solid black;
            margin:50px 34vw;
            font-size:2em;
            border-radius:13px;
        }
        .orange-box{
            background:orange;
            height:32px;
            width:32px;
            position:fixed;
            bottom:12px;
            right:23px;
            border-radius:60px;
        }
        footer{
            height:100px;
            background-color:rgb(188, 143, 143);
        }
    </style>
</head>
<body>
    <header>
        <nav>

        </nav>

    </header>
    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
            <div class="text-box">
                <p>hello guys!</p>
            </div>
        </div>
        <div class="orange-box">


    </main>
    <footer>

    </footer>
</body>
</html>
