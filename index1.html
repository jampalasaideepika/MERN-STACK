<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box shadow and Text shadow</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow:5px 15px 5px red;
            margin-bottom: 15px;
        }
        .box2{
             border: 2px solid black;
            padding: 34px;
            box-shadow:5px 15px 5px rgb(255, 166, 0);
        }
        .text-shadow{
            text-shadow: 5px 15px 5px greenyellow;
        }
    </style>
</head>
<body>
    <div class="box">
        I am box.
    </div> 
    <div class="box2">
        I am  anothere box
    </div>
    <br><br><br>
    <p class="text-shadow">lorem ipsum dolor sit amet consectetur, adipisicing elit. Sint, pariatur.10 

    </p>

</body>
</html>
